<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ozon 找品详情补全</title>
  <style>
    :root { color:#17223b; background:#f3f6fb; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; padding:24px; background:radial-gradient(circle at 95% 0,rgba(116,111,218,.14),transparent 34%),#f3f6fb; }
    .shell { max-width:1280px; margin:0 auto; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; margin-bottom:18px; }
    h1 { margin:0; font-size:24px; }
    .subtitle { margin:7px 0 0; color:#66738d; font-size:13px; line-height:1.55; }
    .version { color:#6972bd; font-size:12px; font-weight:700; }
    .panel { padding:18px; border:1px solid #e3e8f3; border-radius:18px; background:rgba(255,255,255,.94); box-shadow:0 12px 28px rgba(51,65,110,.08); }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
    .file-label, button { min-height:38px; padding:0 16px; border:1px solid transparent; border-radius:10px; font:inherit; font-size:13px; font-weight:800; cursor:pointer; }
    .file-label { display:inline-flex; align-items:center; color:#33466f; background:#edf2ff; border-color:#dae4ff; }
    .file-label input { display:none; }
    button { color:#fff; background:linear-gradient(135deg,#225aeb,#736fda); box-shadow:0 7px 16px rgba(50,83,207,.18); }
    button.secondary { color:#445274; background:#f0f3fa; border-color:#e0e5f0; box-shadow:none; }
    button.stop { color:#a53b51; background:#fff1f3; border-color:#ffd8df; box-shadow:none; }
    button:disabled { opacity:.48; cursor:not-allowed; box-shadow:none; }
    .notice { margin:13px 0 0; color:#63708a; font-size:12px; line-height:1.55; }
    #status { min-height:20px; margin:14px 0 0; color:#4d6388; font-size:13px; font-weight:700; }
    #status[data-state="error"] { color:#b42318; }
    #status[data-state="success"] { color:#067647; }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin:16px 0; }
    .stat { padding:14px 15px; border:1px solid #e5eaf4; border-radius:14px; background:#fff; }
    .stat span { display:block; color:#758099; font-size:11px; }
    .stat strong { display:block; margin-top:5px; font-size:22px; }
    .table-wrap { overflow:auto; border:1px solid #e4e9f2; border-radius:14px; background:#fff; }
    table { width:100%; border-collapse:collapse; min-width:980px; }
    th,td { padding:10px 11px; border-bottom:1px solid #edf0f6; text-align:left; vertical-align:middle; font-size:12px; }
    th { position:sticky; top:0; z-index:1; color:#51617e; background:#f7f9fd; font-size:11px; }
    tr:last-child td { border-bottom:0; }
    .thumb { width:58px; height:58px; object-fit:contain; border:1px solid #e5eaf2; border-radius:9px; background:#f8fafc; }
    .placeholder { display:grid; width:58px; height:58px; place-items:center; border:1px dashed #d6dce8; border-radius:9px; color:#9aa5b8; background:#fafbfe; font-size:10px; }
    .name { max-width:330px; line-height:1.45; }
    .muted { color:#8490a5; }
    .ok { color:#067647; font-weight:800; }
    .bad { color:#b42318; font-weight:800; }
    a { color:#365dca; text-decoration:none; }
    @media (max-width:760px) { body{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}header{display:block}.version{display:block;margin-top:7px} }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>Ozon 找品详情补全</h1>
        <p class="subtitle">导入本地找品任务JSON后，扩展会逐件在后台打开Ozon商品页，读取主图URL并立即关闭临时页。</p>
      </div>
      <span class="version">扩展 v0.6.13 · 主图提速</span>
    </header>
    <main class="panel">
      <div class="toolbar">
        <label class="file-label">选择任务JSON<input id="queueFile" type="file" accept=".json,application/json"></label>
        <button id="start" type="button" disabled>自动补齐主图</button>
        <button id="stop" class="stop" type="button" disabled>处理完当前件后停止</button>
        <button id="download" class="secondary" type="button" disabled>下载补齐后的JSON</button>
      </div>
      <p class="notice">优先直接读取商品页元数据，不打开标签页；仅在直读失败时打开一个后台临时页兜底。只保存主图链接，不下载图片。</p>
      <p id="status" aria-live="polite">请先选择 `batch-...-sample-10.json`。</p>
      <section class="stats" aria-label="处理统计">
        <div class="stat"><span>任务总数</span><strong id="totalCount">0</strong></div>
        <div class="stat"><span>主图成功</span><strong id="successCount">0</strong></div>
        <div class="stat"><span>读取失败</span><strong id="failedCount">0</strong></div>
        <div class="stat"><span>等待处理</span><strong id="pendingCount">0</strong></div>
      </section>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>主图</th><th>SKU</th><th>商品名称</th><th>店铺</th><th>状态</th><th>读取方式</th><th>耗时</th><th>商品页</th></tr></thead>
          <tbody id="taskRows"><tr><td colspan="9" class="muted">尚未导入任务。</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="sourcing-enrichment.js"></script>
</body>
</html>
