<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ozon 商品池</title>
  <link rel="stylesheet" href="product-pool.css">
</head>
<body>
  <main>
    <header><div><h1>商品池</h1><p>跨批次保留已采集商品，按 SKU 去重，管理人工找品进度。</p></div><a href="batch.html">批量店铺扫描</a></header>
    <section class="panel">
      <div class="summary"><div>商品总数<strong id="total">0</strong></div><div>待找品<strong id="newCount">0</strong></div><div>历史查重 SKU<strong id="historyCount">0</strong></div></div>
      <div class="toolbar"><input id="query" type="search" placeholder="搜索 SKU、名称、类目、店铺" aria-label="搜索商品">
        <select id="filter" aria-label="处理状态"><option value="pending" selected>待处理（隐藏已复核、淘汰）</option><option value="">全部状态</option></select><select id="sort" aria-label="排序"><option value="recent">最近发现优先</option><option value="oldest">最早发现优先</option><option value="skuAsc">SKU 升序</option><option value="skuDesc">SKU 降序</option></select><button id="refresh">刷新</button><button id="export" class="primary">导出商品池 CSV</button><button id="backup">下载数据备份</button></div>
      <p>保存状态与备注后会保存在当前浏览器。切换为“全部状态”可以查看已经处理的商品。</p>
      <p id="message" role="status"></p>
      <div class="toolbar batch-tools"><label><input id="selectPage" type="checkbox"> 全选本页</label><span id="selectionCount">已选 0 件</span><button id="saveSelected" class="primary">批量保存已修改项</button><button id="rejectSelected">批量淘汰所选</button></div>
      <div class="table"><table><thead><tr><th class="check-col"></th><th>SKU / 商品</th><th>类目</th><th>采集价格</th><th>重量</th><th>来源 / 最近发现</th><th>处理状态</th><th>备注</th><th class="operation-col">操作</th></tr></thead><tbody id="rows"></tbody></table></div>
      <div class="toolbar"><button id="previous">上一页</button><span id="page"></span><button id="next">下一页</button></div>
    </section>
    <section class="panel"><h2>历史 SKU 查重</h2><p>粘贴已处理或已上架商品 SKU，按行或逗号分隔。命中历史 SKU 的新商品不会重复入池。</p>
      <textarea id="history" rows="5" placeholder="每行一个 SKU" aria-label="历史SKU"></textarea><div class="toolbar"><button id="importHistory" class="primary">导入历史 SKU</button><button id="exportHistory">导出历史 SKU</button></div>
    </section>
  </main>
  <script src="store-scanner-core.js"></script><script src="product-pool-core.js"></script><script src="product-pool.js"></script>
</body>
</html>
